name: build.yml
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        targetOs: [ windows-x86_64, linux-x86_64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Execute Build (${{ matrix.targetOs }})
        run: |
          chmod +x ./gradlew
          ./gradlew shadowJar -PtargetOs=${{ matrix.targetOs }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: BPSR-Bot-${{ matrix.targetOs }}
          path: build/libs/*-all.jar
          retention-days: 2

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*-all.jar