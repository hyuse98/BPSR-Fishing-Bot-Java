name: build.yml
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          # cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle has execution permission.
        run: chmod +x ./gradlew

      - name: Build Windows
        run: ./gradlew shadowJar -PtargetOs=windows-x86_64

      - name: Build Linux
        run: ./gradlew shadowJar -PtargetOs=linux-x86_64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BPSR-Bot-Executables
          path: build/libs/*-all.jar
          retention-days: 14